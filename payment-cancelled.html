<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Payment not completed | Prepared Paws</title>
    <link rel="icon" href="favicon.png" />
    <link rel="stylesheet" href="styles.css" />
    <style>.payment-page{min-height:100vh;display:grid;place-items:center;padding:30px;background:var(--sky)}.payment-card{width:min(560px,100%);padding:42px;background:var(--cream);border-radius:20px;text-align:center;box-shadow:0 16px 35px #123e7020}.payment-card img{width:180px;max-width:80%;margin-bottom:32px}.payment-card h1{font-size:clamp(2.25rem,5vw,3.3rem)}.payment-card .button{margin:10px 5px}.payment-status-icon{width:54px;height:54px;margin:0 auto 18px;border:0;background:#f7d9cf;border-radius:50%;display:grid;place-items:center;font-size:1.6rem}</style>
    <script src="payment-cancelled.js" defer></script>
  </head>
  <body>
    <main class="payment-page"><section class="payment-card" aria-live="polite"><img src="prepared-paws-logo.svg" alt="Prepared Paws" /><div class="payment-status-icon" aria-hidden="true">!</div><p class="eyebrow">Payment not completed</p><h1>Need a moment?</h1><p id="payment-message">Your payment was not completed. You can return to secure checkout without entering your registration details again.</p><button class="button" id="retry-payment" type="button">Return to secure checkout</button><a class="text-link" href="index.html">Return to Prepared Paws</a></section></main>
  </body>
</html>
