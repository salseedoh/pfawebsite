<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Prepared Paws double P logo</title>
  <desc id="desc">Two overlapping P letters with true negative-space paw-print and first-aid-cross counters, followed by a wordmark and training details.</desc>
  <rect width="1600" height="1100" fill="#ffffff"/>

  <defs>
    <!-- A generously sized paw counter, designed as a simple silhouette rather than separate tiny marks. -->
    <mask id="paw-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1100">
      <rect width="1600" height="1100" fill="#ffffff"/>
      <g fill="#000000" transform="translate(671 284)">
        <ellipse cx="0" cy="70" rx="65" ry="53"/>
        <ellipse cx="-68" cy="6" rx="25" ry="37" transform="rotate(-28 -68 6)"/>
        <ellipse cx="-24" cy="-31" rx="25" ry="37" transform="rotate(-8 -24 -31)"/>
        <ellipse cx="27" cy="-31" rx="25" ry="37" transform="rotate(9 27 -31)"/>
        <ellipse cx="71" cy="7" rx="25" ry="37" transform="rotate(29 71 7)"/>
      </g>
    </mask>
    <mask id="cross-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1100">
      <rect width="1600" height="1100" fill="#ffffff"/>
      <g fill="#000000" transform="translate(937 229)">
        <rect x="57" y="0" width="62" height="198" rx="14"/>
        <rect x="0" y="68" width="176" height="62" rx="14"/>
      </g>
    </mask>
  </defs>

  <!-- Solid, rounded P silhouettes. There is no normal D-shaped counter:
       each letter is opened only by its oversized symbol. -->
  <path d="M778 70h165c184 0 292 104 292 250S1127 570 943 570h-45v157c0 31-25 56-56 56h-64c-31 0-56-25-56-56V126c0-31 25-56 56-56Z" fill="#0E2D56" mask="url(#cross-cutout)"/>
  <path d="M455 70h165c184 0 292 104 292 250S804 570 620 570h-45v157c0 31-25 56-56 56h-64c-31 0-56-25-56-56V126c0-31 25-56 56-56Z" fill="#3479F5" mask="url(#paw-cutout)"/>

  <!-- Clear, separated type stack. -->
  <text x="800" y="872" text-anchor="middle" font-family="'Arial Rounded MT Bold', 'Trebuchet MS', Arial, sans-serif" font-size="128" font-weight="700" letter-spacing="-5">
    <tspan fill="#3479F5">Prepared</tspan><tspan fill="#0E2D56"> Paws</tspan>
  </text>
  <text x="800" y="950" text-anchor="middle" fill="#0E2D56" font-family="'Century Gothic', Arial, Helvetica, sans-serif" font-size="33" font-weight="700" letter-spacing="6">PET FIRST AID &amp; CPR</text>
  <text x="800" y="1024" text-anchor="middle" fill="#60728C" font-family="'Century Gothic', Arial, Helvetica, sans-serif" font-size="31" letter-spacing="1">by Pet Pampering Plus</text>
</svg>
