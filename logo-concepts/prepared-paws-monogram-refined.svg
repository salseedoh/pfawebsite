<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Prepared Paws refined monogram logo</title>
  <desc id="desc">A blue P monogram holding a paw print, with an integrated first-aid plus and the Prepared Paws wordmark.</desc>
  <rect width="1600" height="640" fill="#ffffff"/>

  <!-- Mark: a single, simple P silhouette. Its counter holds the pet cue, while the lower
       stem carries the first-aid cue; both remain legible at small sizes. -->
  <g transform="translate(116 94)">
    <path d="M38 0h184c109 0 180 66 180 165s-71 165-180 165H142v152c0 24-19 43-43 43H38C17 525 0 508 0 486V39C0 17 17 0 38 0Zm104 96v138h77c48 0 78-25 78-69s-30-69-78-69h-77Z" fill="#3979F6"/>

    <!-- Paw, deliberately compact so it reads as one clean interior shape. -->
    <g fill="#ffffff" transform="translate(218 159)">
      <ellipse cx="0" cy="28" rx="31" ry="25"/>
      <ellipse cx="-31" cy="-1" rx="12" ry="16" transform="rotate(-25 -31 -1)"/>
      <ellipse cx="-10" cy="-17" rx="12" ry="16" transform="rotate(-8 -10 -17)"/>
      <ellipse cx="13" cy="-17" rx="12" ry="16" transform="rotate(10 13 -17)"/>
      <ellipse cx="34" cy="0" rx="12" ry="16" transform="rotate(27 34 0)"/>
    </g>

    <!-- The plus is cut from the vertical stem: connected to the mark, not floating beside it. -->
    <g fill="#ffffff" transform="translate(70 378)">
      <rect x="25" y="0" width="30" height="92" rx="15"/>
      <rect x="0" y="31" width="80" height="30" rx="15"/>
    </g>
  </g>

  <g transform="translate(570 184)">
    <text x="0" y="96" fill="#112A54" font-family="Georgia, 'Times New Roman', serif" font-size="122" font-weight="700" letter-spacing="-4">Prepared Paws</text>
    <path d="M4 143H864" stroke="#3979F6" stroke-width="5" stroke-linecap="round"/>
    <text x="0" y="202" fill="#224A88" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" letter-spacing="5">PET FIRST AID &amp; CPR</text>
    <text x="0" y="257" fill="#5D6F8F" font-family="Arial, Helvetica, sans-serif" font-size="31" letter-spacing="1">by Pet Pampering Plus</text>
  </g>
</svg>
