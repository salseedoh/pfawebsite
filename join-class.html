<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Join Your Virtual Class | Prepared Paws</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="logo.css">
  <link rel="stylesheet" href="theme.css">

<body class="join-page">
  <header class="site-header"><a class="brand" href="index.html"><img src="prepared-paws-logo.svg" alt="Prepared Paws"></a></header>
  <main class="join-main">
    <section class="join-card" id="join-card" aria-live="polite">

      <div id="jaas-meeting" class="jaas-meeting"></div>

  </main>
  <script src="join-class.js"></script>
